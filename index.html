<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

        <script>
            /**
             * Extract data from DOM
             */

            function extractRun() {
                let tbl = document.getElementById("runTblBdy");

                return {
                    name: extractName(),
                    cmd: document.getElementById("runCmd").value.split(" "),
                    input: document.getElementById("runInFN").value,
                    points: parseFloat(document.getElementById("runPts").value),
                    events: extractEvents(document.getElementById("eventTblBdy")),
                    criteria: extractCriteria(tbl)
                };
            }

            function extractName() {
                return document.getElementById("runName").value
            }

            function extractEvents(tblBdy) {
                let before = [];
                let after = [];

                for (let row of tblBdy.children) {

                    let eventType = null;
                    let cmd = null;

                    let colI = 0;
                    for (let datum of row.children) {
                        let tag = datum.children[0];
                        if (colI === 0) {
                            eventType = tag.value;
                        } else if (colI === 1) {
                            cmd = tag.value;
                        } else {
                            window.alert("Too many columns in event table");
                        }

                        colI++;
                    }

                    if (eventType !== null && cmd !== null) {
                        if (eventType === "before") {
                            before.push(cmd.split(" "));
                        } else if (eventType === "after") {
                            after.push(cmd.split(" "));
                        } else {
                            window.alert("Unrecognized eventType = " + eventType);
                        }
                    } else {
                        window.alert("Error: eventType = " + eventType + " cmd = " + cmd);
                    }
                }

                return {
                    before: before.length > 0 ? before : undefined,
                    after: after.length > 0 ? after : undefined
                }
            }

            function extractCriteria(tbl) {
                let criteria = [];

                for (let row of tbl.children) {
                    let criterion = extractCriterionFromRow(row);

                    criteria.push(criterion);
                }

                return criteria;
            }

            function extractCriterionFromRow(row) {
                let criterion = {};

                let i = 0;
                for (let datum of row.children) {
                    let tag = datum.children[0];
                    if (i === 0) {
                        criterion.requirement = tag.value;
                    } else if (i === 1) {
                        criterion.expected = tag.value;
                    } else if (i == 2) {
                        criterion.endsWithInput = tag.checked;
                    } else {
                        window.alert("Too many columns in criteria table");
                    }

                    i++;
                }

                return criterion;
            }
        </script>
        <script>
            /**
             * DOM Manipulation
             */

            function parseRubric(text) {
                let rubric = JSON.parse(text);

                runs = {};
                for (let run of rubric.runs) {
                    runs[run.name] = run;
                }

                refreshRunSelectOptions();
                loadRun();
            }

            function refreshRunSelectOptions() {
                let select = document.getElementById("runSlt");

                let selectedValue = null;
                while (select.firstChild) {
                    if (select.firstChild.selected) {
                        selectedValue = select.firstChild.value;
                    }

                    select.removeChild(select.firstChild);
                }

                let names = [];
                for (let name in runs) {
                    names.push(name);
                }

                console.log(selectedValue);
                for (let name of names.sort()) {
                    let option = document.createElement("option");
                    option.innerHTML = name;
                    option.value = name;
                    if (selectedValue === null) {
                        option.selected = true;
                        selectedValue = name;
                    }
                    select.appendChild(option);
                }
                console.log(selectedValue);

                select.value = selectedValue;
            }

            function loadRun() {
                let runName = document.getElementById("runSlt").value;
                if (!runName) {
                    window.alert("Error: No run name");
                    return;
                }

                if (runs[runName] === undefined) {
                    window.alert("No run named " + runName);
                    return;
                }

                let tblBdy = document.getElementById("runTblBdy");
                while (tblBdy.firstChild) {
                    tblBdy.removeChild(tblBdy.firstChild);
                }

                let runNameInput = document.getElementById("runName");
                runNameInput.value = runName;
                runNameInput.disabled = true;

                for (let criterion of runs[runName].criteria) {
                    let row = document.createElement("tr");

                    // Column: Requirement
                    let td = document.createElement("td");
                    td.appendChild(buildRequirementSelect(criterion));
                    row.appendChild(td);

                    // Column: Expected
                    td = document.createElement("td");
                    td.appendChild(buildExpected(criterion));
                    row.appendChild(td);

                    // Column: Ends with Input
                    td = document.createElement("td");
                    td.appendChild(buildEndsWithInputChecbox(criterion));
                    row.appendChild(td);

                    tblBdy.appendChild(row);
                }
            }

            //#region Inflating run table
            function buildRequirementSelect(criterion) {
                let select = document.createElement("select");
                select.appendChild(buildOption("exact", "Exact"));
                select.appendChild(buildOption("pattern", "Regular Expression"));
                select.appendChild(buildOption("ignore", "Ignore"));
                select.value = criterion.requirement;
                return select;
            }

            function buildOption(value, text, selected) {
                let option = document.createElement("option");
                option.value = value;
                option.innerHTML = text;

                option.selected = selected !== undefined && selected === true;

                return option;
            }

            function buildExpected(criterion) {
                let input = document.createElement("input");
                input.type = "text";
                input.style.width = "100%";
                input.value = criterion.expected;
                return input;
            }

            function buildEndsWithInputChecbox(criterion) {
                let checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                if (criterion["endsWithInput"] !== undefined && criterion["endsWithInput"] === true) {
                    checkbox.checked = true;
                }
                return checkbox;
            }
            //#endregion
        </script>
        <script>
            /**
             * User DOM Manipulation
             */

            function hideAllSections() {
                for (let id of ["files", "content", "compile", "runs"]) {
                    let section = document.getElementById(id);
                    section.style.display = "none";
                }
            }

            function showRunEditor() {
                hideAllSections();
                document.getElementById("runs").style.display = "block";
            }

            function addRunEvent() {
                let row = document.createElement("tr");

                // Event type select
                let td = document.createElement("td");
                row.appendChild(td);

                let slt = document.createElement("select");
                td.appendChild(slt);

                let opt = document.createElement("option");
                opt.value = "before";
                opt.innerHTML = "Before";
                opt.selected = true;
                slt.appendChild(opt);

                opt = document.createElement("option");
                opt.value = "after";
                opt.innerHTML = "After";
                slt.appendChild(opt);

                // Command input
                td = document.createElement("td");
                row.appendChild(td);

                let input = document.createElement("input");
                td.appendChild(input);

                input.classList.add("w3-input");
                input.classList.add("w3-border");
                input.style.width = "100%";
                input.type = "text";

                let tblBdy = document.getElementById("eventTblBdy");
                tblBdy.appendChild(row);
            }

            function addRun() {
                // Empty and show run name field
                let runNameInput = document.getElementById("runName");
                runNameInput.value = "";
                runNameInput.disabled = false;

                // Clear run table and add empty row
                let runTblBdy = document.getElementById("runTblBdy");
                while (runTblBdy.firstChild) {
                    runTblBdy.removeChild(runTblBdy.firstChild);
                }

                addLine();

                // Update UI
                showRunEditor();
            }
        </script>
        <script>
            let files = {};
            let content = {};
            let compile = {};
            let runs = {};

            function addLine() {
                let row = document.createElement("tr");

                // Select
                let select = document.createElement("select");

                let opt = document.createElement("option");
                opt.value = "exact";
                opt.innerHTML = "Exact";
                select.appendChild(opt);

                opt = document.createElement("option");
                opt.value = "pattern";
                opt.innerHTML = "Regular Expression";
                select.appendChild(opt);

                opt = document.createElement("option");
                opt.value = "ignore";
                opt.innerHTML = "Ignore";
                select.appendChild(opt);

                let td = document.createElement("td");
                td.appendChild(select);
                row.appendChild(td);

                // Expected

                let input = document.createElement("input");
                input.type = "text";
                input.style.width = "100%";

                td = document.createElement("td");
                td.appendChild(input);
                row.appendChild(td);

                // Input

                input = document.createElement("input");
                input.type = "checkbox";

                td = document.createElement("td");
                td.appendChild(input);
                row.appendChild(td);

                // Row

                let table = document.getElementById("runTblBdy");
                table.appendChild(row)
            }

            function saveRun() {
                let run = extractRun()
                if (run.name.trim().length > 0) {
                    runs[run.name] = run;

                    refreshRunSelectOptions();
                } else {
                    window.alert("Cannot save run because the name is blank");
                }
            }

            window.addEventListener("load", function () {
                // Save
                document.getElementById("saveBtn").addEventListener("click", function() {
                    let rubric = {
                        files: files,
                        content: content,
                        compile: compile,
                        runs: []
                    };

                    for (let name in runs) {
                        let run = runs[name];
                        run.name = name;
                        rubric.runs.push(run)
                    }

                    // From: https://web.dev/patterns/files/save-a-file
                    let downloadLink = document.createElement("a");

                    let url = URL.createObjectURL(
                        // From: https://robkendal.co.uk/blog/2020-04-17-saving-text-to-client-side-file-using-vanilla-js/
                        new Blob([JSON.stringify(rubric)], {type: "text/plain"})
                    );
                    downloadLink.href = url
                    downloadLink.download = "rubric.json";
                    downloadLink.style.display = "none";

                    document.body.append(downloadLink);

                    downloadLink.click();

                    setTimeout(
                        function() {
                            URL.revokeObjectURL(url);
                            downloadLink.remove();
                        },
                        1000
                    );
                });

                // Load (Google AI Code)
                document.getElementById("filePicker").addEventListener("change", function(event) {
                    let file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();

                    // Triggered when file reading finishes successfully
                    reader.onload = (e) => {
                        const fileContent = e.target.result;
                        console.log("Raw File Content:", fileContent);
                        parseRubric(fileContent);
                    };

                    // Triggered if an error occurs during reading
                    reader.onerror = () => console.error("Error reading file.");

                    // Read the file structure as a plain text string
                    reader.readAsText(file);
                });

                showRunEditor();
            });
        </script>
    </head>
    <body>
        <nav class="w3-sidebar w3-bar-block" style="width: 25%">
            <input id="filePicker" type="file" accept=".json" /><br/>
            <button>Files</button><br/>
            <button>Content</button><br/>
            <button>Compile</button><br/>
            Run <select id="runSlt"></select>
            <button id="loadRunBtn" onclick="loadRun()">Load</button><br/>
            <button onclick="addRun()">Add Run</button><br/>
            <button id="saveBtn">Save to Downloads</button>
        </nav>
        <div class="w3-container" style="margin-left: 25%">
            <section id="files" class="w3-container">
                File Requirements
            </section>
            <section id="content" class="w3-container">
                File Content Requirements
            </section>
            <section id="compile" class="w3-container">
                File Compile Requirements
            </section>
            <section id="runs" >
                <div class="w3-panel w3-card-4" style="width: 50%;">
                    Name <input id="runName" class="w3-input w3-border" type="text" /><br/>
                    Command <input id="runCmd" class="w3-input w3-border" type="text" /><br/>
                    Input File Name <input id="runInFN" class="w3-input w3-border" type="text" /><br/>
                    Points <input id="runPts" class="w3-input w3-border" type="number" /><br/>
                    <button id="saveRunBtn" class="w3-btn w3-green" onclick="saveRun()">Save Run</button>
                </div>
                <div class="w3-panel">
                    <h3>Events</h3>
                    <table class="w3-table-all">
                        <colgroup>
                            <col style="width: fit-content;" />
                            <col style="width: 100%;" />
                        </colgroup>
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Command</th>
                            </tr>
                        </thead>
                        <tbody id="eventTblBdy">
                        </tbody>
                    </table>
                    <button class="w3-btn w3-green" onclick="addRunEvent()">Add Event</button>
                </div>

                <table id="runTbl" class="w3-table-all">
                    <colgroup>
                        <col style="width: fit-content;"/>
                        <col style="width: 100%;" />
                        <col style="width: fit-content"/>
                    </colgroup>
                    <thead>
                        <tr class="w3-brown">
                            <th>Requirement</th>
                            <th>Expected</th>
                            <th>Ends&nbsp;with&nbsp;Input?</th>
                        </tr>
                    </thead>
                    <tbody id="runTblBdy">
                        <tr>
                            <td>
                                <select>
                                    <option value="exact">Exact</option>
                                    <option value="pattern">Regular Expression</option>
                                    <option value="ignore">Ignore</option>
                                </select>
                            </td>
                            <td><input type="text" style="width: 100%;" /></td>
                            <td><input type="checkbox" /></td>
                        </tr>
                    </tbody>
                </table>
                <button onclick="addLine()">+ Add Line</button>
            </section>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

        <script>
            /**
             * Extract data from DOM
             */

            function extractRun() {
                let tbl = document.getElementById("runTblBdy");

                return {
                    name: extractName(),
                    criteria: extractCriteria(tbl)
                };
            }

            function extractName() {
                return document.getElementById("runName").value
            }

            function extractCriteria(tbl) {
                let criteria = [];

                for (let row of tbl.children) {
                    let criterion = extractCriterionFromRow(row);

                    criteria.push(criterion);
                }

                return criteria;
            }

            function extractCriterionFromRow(row) {
                let criterion = {};

                let i = 0;
                for (let datum of row.children) {
                    let tag = datum.children[0];
                    if (i === 0) {
                        criterion.requirement = tag.value;
                    } else if (i === 1) {
                        criterion.expected = tag.value;
                    } else if (i == 2) {
                        criterion.endsWithInput = tag.checked;
                    } else {
                        window.alert("Too many columns in criteria table");
                    }

                    i++;
                }

                return criterion;
            }
        </script>
        <script>
            let files = {};
            let content = {};
            let compile = {};
            let runs = {};

            function addLine() {
                let row = document.createElement("tr");

                // Select
                let select = document.createElement("select");

                let opt = document.createElement("option");
                opt.value = "exact";
                opt.innerHTML = "Exact";
                select.appendChild(opt);

                opt = document.createElement("option");
                opt.value = "pattern";
                opt.innerHTML = "Regular Expression";
                select.appendChild(opt);

                opt = document.createElement("option");
                opt.value = "ignore";
                opt.innerHTML = "Ignore";
                select.appendChild(opt);

                let td = document.createElement("td");
                td.appendChild(select);
                row.appendChild(td);

                // Expected

                let input = document.createElement("input");
                input.type = "text";

                td = document.createElement("td");
                td.appendChild(input);
                row.appendChild(td);

                // Input

                input = document.createElement("input");
                input.type = "checkbox";

                td = document.createElement("td");
                td.appendChild(input);
                row.appendChild(td);

                // Row

                let table = document.getElementById("runTblBdy");
                table.appendChild(row)
            }

            function saveRun() {
                let run = extractRun()
                if (run.name.trim().length > 0) {
                    runs[run.name] = run;

                    console.log(runs);
                } else {
                    window.alert("Cannot save run because the name is blank");
                }
            }

            window.addEventListener("load", function () {
                // Save
                document.getElementById("saveBtn").addEventListener("click", function() {
                    let rubric = {
                        files: files,
                        content: content,
                        compile: compile,
                        runs: []
                    };

                    for (let name in runs) {
                        let run = runs[name];
                        run.name = name;
                        rubric.runs.append(run)
                    }

                    // From: https://web.dev/patterns/files/save-a-file
                    let downloadLink = document.createElement("a");

                    let url = URL.createObjectURL(
                        // From: https://robkendal.co.uk/blog/2020-04-17-saving-text-to-client-side-file-using-vanilla-js/
                        new Blob([JSON.stringify(rubric)], {type: "text/plain"})
                    );
                    downloadLink.href = url
                    downloadLink.download = "rubric.json";
                    downloadLink.style.display = "none";

                    document.body.append(downloadLink);

                    downloadLink.click();

                    setTimeout(
                        function() {
                            URL.revokeObjectURL(url);
                            downloadLink.remove();
                        },
                        1000
                    );
                });

                // Load (Google AI Code)
                document.getElementById("filePicker").addEventListener("change", function(event) {
                    let file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();

                    // Triggered when file reading finishes successfully
                    reader.onload = (e) => {
                        const fileContent = e.target.result;
                        console.log("Raw File Content:", fileContent);
                        // You can now pass fileContent to your custom parser logic
                    };

                    // Triggered if an error occurs during reading
                    reader.onerror = () => console.error("Error reading file.");

                    // Read the file structure as a plain text string
                    reader.readAsText(file);
                });
            });
        </script>
    </head>
    <body>
        <nav>
            <button id="saveBtn">Save to Downloads</button>
            <!-- TODO: File Picker -->
            <input id="filePicker" type="file" accept=".json" />
        </nav>
        <section id="files">

        </section>
        <section id="content">
            
        </section>
        <section id="compile">
            
        </section>
        <section id="runs">
            <button id="newRunBtn">New Run</button><br/>

            <select id="runSlt"></select>
            <button id="loadRunBtn">Load Run</button><br/>

            <input id="runName" type="text" />
            <button id="saveRunBtn" onclick="saveRun()">Save Run</button>

            <table id="runTbl" class="w3-table">
                <thead>
                    <tr>
                        <th>Requirement</th>
                        <th>Expected</th>
                        <th>Ends with Input?</th>
                    </tr>
                </thead>
                <tbody id="runTblBdy">
                    <tr>
                        <td>
                            <select>
                                <option value="exact">Exact</option>
                                <option value="pattern">Regular Expression</option>
                                <option value="ignore">Ignore</option>
                            </select>
                        </td>
                        <td><input type="text" /></td>
                        <td><input type="checkbox" /></td>
                    </tr>
                </tbody>
            </table>
            <button onclick="addLine()">+ Add Line</button>
        </section>
    </body>
</html>
